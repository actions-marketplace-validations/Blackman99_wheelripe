[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelripe"
version = "0.1.0"
description = "Before you move to a new Python (3.15, 3.15t), find every dependency with no wheel for it on your platforms, and the version bump that fixes it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Blackman99" }]
keywords = ["python-3.15", "wheels", "packaging", "upgrade", "free-threading", "abi3t", "uv", "lockfile", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = ["packaging>=23.0", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wheelripe = "wheelripe.cli:main"

[project.urls]
Homepage = "https://blackman99.github.io/wheelripe/"
Documentation = "https://blackman99.github.io/wheelripe/docs/"
Source = "https://github.com/Blackman99/wheelripe"
Issues = "https://github.com/Blackman99/wheelripe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits the real PyPI and pip (set WHEELRIPE_LIVE=1)"]
